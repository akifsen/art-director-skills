name: ci

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      capture_visuals:
        description: 'Capture review artifacts (not aesthetic approval)'
        type: boolean
        default: false

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
      - name: Structure, example-store, installer safety tests (symlinks required)
        env:
          AD_REQUIRE_SYMLINKS: "1"
        run: npm test
      - name: Packaged CLI in a clean consumer project (real tarball, offline)
        env:
          AD_REQUIRE_SYMLINKS: "1"
        run: npm run test:packaged
      - name: Isolated skills CLI install
        env:
          DISABLE_TELEMETRY: "1"
          DO_NOT_TRACK: "1"
        run: npm run test:install
      - name: Pack skill directory
        run: npm run pack-skill

  examples-web:
    runs-on: ubuntu-latest
    env:
      ART_DIRECTOR_EVAL: ${{ github.event_name == 'workflow_dispatch' && inputs.capture_visuals && '1' || '0' }}
      ART_DIRECTOR_CRAFT: ${{ github.event_name == 'workflow_dispatch' && inputs.capture_visuals && '1' || '0' }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm
      - name: Install maintainer deps from lockfile
        run: npm ci
      - name: Compile React examples with Vite
        env:
          ART_DIRECTOR_SEEFIX: "1"
        run: npm run test:examples:build
      - name: Install bundled Chromium for Playwright
        run: npx playwright install --with-deps chromium
      - name: Browser flows on production preview (not a native runtime)
        run: npm run test:e2e
      - name: Hand-corrected Fold flows
        env:
          ART_DIRECTOR_SEEFIX: "1"
        run: npm run test:e2e:seefix
      - name: Selected successful visual capture
        if: github.event_name == 'workflow_dispatch' && inputs.capture_visuals
        run: npm run test:e2e:visual
      - name: Saved evaluation output flows (no model invocation)
        if: github.event_name == 'workflow_dispatch' && inputs.capture_visuals
        run: npx playwright test --project=quality
      - name: Normal-brief saved output flows (explicit attachment fallback)
        if: github.event_name == 'workflow_dispatch' && inputs.capture_visuals
        run: npx playwright test --project=craft
      - name: Preserve selected renders for review
        if: always() && github.event_name == 'workflow_dispatch' && inputs.capture_visuals
        uses: actions/upload-artifact@v4
        with:
          name: visual-review-renders
          path: evals/artifacts/*.png
          retention-days: 30
          if-no-files-found: error
      - name: Upload Playwright traces on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-web
          path: |
            playwright-report
            test-results
          if-no-files-found: ignore

  native-runtime:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
      - name: Native source/store checks only
        run: npm test
      - name: Device/simulator not claimed
        run: echo "Gate D native runtime is pending. Expo web is not a substitute."
