name: ci

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
      - name: Structure and example-store tests
        run: npm test
      - name: Isolated skills CLI install
        env:
          DISABLE_TELEMETRY: "1"
          DO_NOT_TRACK: "1"
        run: npm run test:install
      - name: Pack skill directory
        run: npm run pack-skill

  examples-web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm
      - name: Install maintainer deps from lockfile
        run: npm ci
      - name: Compile React examples with Vite
        run: npm run test:examples:build
      - name: Install Chromium for Playwright
        run: npx playwright install --with-deps chromium
      - name: Browser flows (not a native runtime)
        run: npm run test:e2e
      - name: Upload Playwright traces on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-web
          path: |
            playwright-report
            test-results
          if-no-files-found: ignore

  native-runtime:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
      - name: Native source/store checks only
        run: npm test
      - name: Device/simulator not claimed
        run: echo "Gate D native runtime is pending. Expo web is not a substitute."
