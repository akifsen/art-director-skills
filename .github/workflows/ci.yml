name: ci

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Structure and trigger tests
        run: npm test
      - name: Isolated skills CLI install
        env:
          DISABLE_TELEMETRY: "1"
          DO_NOT_TRACK: "1"
        run: npm run test:install
      - name: Pack skill directory
        run: npm run pack-skill
