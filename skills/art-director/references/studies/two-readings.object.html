<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Mira Chen — object reading (study)</title>
  <style>
    :root {
      --vinyl: #0e0d0c;
      --groove: #1a1917;
      --label: #efe6d4;
      --ink: #ece7df;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      background: var(--vinyl);
      color: var(--ink);
      font-family: Palatino, "Palatino Linotype", "Times New Roman", serif;
    }
    a { color: var(--label); }
    a:focus-visible { outline: 2px solid var(--label); outline-offset: 3px; }
    .wrap {
      display: grid;
      grid-template-columns: minmax(0, 1fr) minmax(16rem, 22rem);
      min-height: 100vh;
    }
    .specimen {
      display: grid;
      place-items: center;
      padding: 2rem;
    }
    .disc {
      width: min(72vw, 28rem);
      aspect-ratio: 1;
      border-radius: 50%;
      background:
        repeating-radial-gradient(circle at 50% 50%,
          var(--groove) 0 2px,
          #121110 2px 4px);
      display: grid;
      place-items: center;
      box-shadow: inset 0 0 0 1px rgb(255 255 255 / 6%);
    }
    .label {
      width: 38%;
      aspect-ratio: 1;
      border-radius: 50%;
      background: var(--label);
      color: #1a1610;
      display: grid;
      place-content: center;
      text-align: center;
      padding: 0.6rem;
      font-size: 0.7rem;
      line-height: 1.25;
    }
    .label strong {
      display: block;
      font-size: 0.95rem;
      font-weight: 600;
      margin-top: 0.15rem;
    }
    aside {
      padding: 2.2rem 1.6rem;
      border-left: 1px solid rgb(236 231 223 / 12%);
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }
    h1 {
      margin: 0;
      font-size: clamp(2rem, 4vw, 3rem);
      font-weight: 500;
      letter-spacing: -0.02em;
      line-height: 1;
    }
    .note {
      margin: 1rem 0 0;
      max-width: 34ch;
      font-size: 1.05rem;
      color: rgb(236 231 223 / 72%);
    }
    ol {
      list-style: none;
      margin: 2rem 0 0;
      padding: 0;
    }
    li {
      display: flex;
      justify-content: space-between;
      gap: 0.75rem;
      padding: 0.55rem 0;
      border-top: 1px solid rgb(236 231 223 / 12%);
      font-size: 0.95rem;
    }
    .meta {
      font-family: "Segoe UI", sans-serif;
      font-size: 0.7rem;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: rgb(236 231 223 / 55%);
    }
    @media (max-width: 800px) {
      .wrap { grid-template-columns: 1fr; }
      aside { border-left: 0; border-top: 1px solid rgb(236 231 223 / 12%); }
      .disc { width: min(80vw, 20rem); }
    }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="specimen">
      <div class="disc" role="img" aria-label="Diagram of a lathe-cut disc, not a photograph of the record.">
        <div class="label">
          Field cut
          <strong>Yard at 04:10</strong>
          18 min
        </div>
      </div>
    </div>
    <aside>
      <div>
        <p class="meta">Fourteen copies remain</p>
        <h1>Mira Chen</h1>
        <p class="note">A lathe-cut of the overpass tape. The grooves are a diagram, not a photograph.</p>
        <ol>
          <li>Yard at 04:10 <span class="meta">this cut</span></li>
          <li>Ferry wake</li>
          <li>Boiler room</li>
        </ol>
      </div>
      <p><a href="mailto:mira@fieldcut.example">Ask for a copy</a></p>
    </aside>
  </div>
</body>
</html>
