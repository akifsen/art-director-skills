<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sona Hale — quiet (study)</title>
  <style>
    :root { --ink: #171614; --paper: #f7f6f2; --rule: #d7d3c8; }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      background: var(--paper);
      color: var(--ink);
      font-family: "Segoe UI", "Trebuchet MS", "Helvetica Neue", sans-serif;
    }
    .frame {
      min-height: 100vh;
      display: grid;
      grid-template-rows: auto 1fr auto;
      padding: 1.25rem 1.5rem 1.4rem;
    }
    .top, .bot {
      display: flex;
      justify-content: space-between;
      font-size: 0.72rem;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      border-bottom: 1px solid var(--rule);
      padding-bottom: 0.7rem;
    }
    .bot { border-bottom: 0; border-top: 1px solid var(--rule); padding: 0.8rem 0 0; }
    a { color: var(--ink); text-decoration: none; border-bottom: 1px solid var(--ink); }
    a:hover { border-bottom-width: 2px; }
    a:focus-visible { outline: 2px solid var(--ink); outline-offset: 3px; }
    main {
      display: flex;
      flex-direction: column;
      justify-content: center;
      max-width: 22rem;
      padding: 8vh 0;
    }
    h1 {
      margin: 0;
      font-weight: 500;
      font-size: clamp(2.4rem, 8vw, 3.4rem);
      letter-spacing: -0.04em;
      line-height: 0.95;
    }
    p {
      margin: 1.1rem 0 0;
      font-size: 1.02rem;
      line-height: 1.45;
      max-width: 28ch;
    }
  </style>
</head>
<body>
  <div class="frame">
    <div class="top">
      <span>Patent claims</span>
      <span>EN ↔ TR</span>
    </div>
    <main>
      <h1>Sona Hale</h1>
      <p>I translate claims and the stubborn words around them — including ğüşıöç — and send them back in the other language.</p>
    </main>
    <div class="bot">
      <a href="mailto:sona@hale.example">sona@hale.example</a>
      <span>No intake form on this page</span>
    </div>
  </div>
</body>
</html>
