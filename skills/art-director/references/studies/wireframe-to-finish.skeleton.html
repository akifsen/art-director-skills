<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Rail Still — skeleton (study)</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; font-family: system-ui, sans-serif; color: #222; }
    .hero { padding: 4rem 1.5rem; text-align: center; background: #f3f3f3; }
    .ph { height: 180px; background: #ddd; margin: 1rem auto; max-width: 40rem; }
    .cards { display: grid; grid-template-columns: repeat(3, 1fr); gap: 1rem; padding: 2rem; }
    .cards article { border: 1px solid #ddd; padding: 1.5rem; border-radius: 1rem; }
    .btn { display: inline-block; margin-top: 1rem; padding: 0.6rem 1rem; background: #7c5cfc; color: #fff; text-decoration: none; }
    @media (max-width: 700px) { .cards { grid-template-columns: 1fr; } }
  </style>
</head>
<body>
  <header class="hero">
    <p>Welcome</p>
    <h1>Rail Still</h1>
    <p>Premium lighting photography for modern brands.</p>
    <div class="ph" aria-hidden="true"></div>
    <a class="btn" href="mailto:desk@railstill.example">Get started</a>
  </header>
  <section class="cards">
    <article>
      <h2>Linear 40</h2>
      <p>Ferry cabin. 48V ceiling channel. 2026.</p>
    </article>
    <article>
      <h2>Dock flood</h2>
      <p>Municipal yard. Pole-mounted flood.</p>
    </article>
    <article>
      <h2>Task arm</h2>
      <p>Drafting table. Close crop on the joints.</p>
    </article>
  </section>
</body>
</html>
